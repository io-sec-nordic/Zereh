name: CD

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            llvm \
            make \
            pkg-config \
            libbpf-dev \
            libyaml-dev \
            libelf-dev \
            zlib1g-dev

      - name: Build and generate
        run: |
          make deps-check
          make clean
          make -j"$(nproc)"
          make generate

      - name: Prepare release archive
        run: |
          mkdir -p dist
          ARCHIVE_NAME="zereh-${GITHUB_REF_NAME:-snapshot}.tar.gz"
          tar -czf "dist/${ARCHIVE_NAME}" build config.yaml readme.md scripts VERSION
          echo "ARCHIVE=dist/${ARCHIVE_NAME}" >> "$GITHUB_ENV"

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: zereh-package
          path: ${{ env.ARCHIVE }}

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
